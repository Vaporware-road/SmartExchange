name: smart-exchange

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    command: >
      sh -c "mkdir -p /app/backend/data /app/backend/public/media /app/backend/public/staticfiles &&
             cd /app/backend &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py ensure_default_admin &&
             exec supervisord -c /etc/supervisor/conf.d/supervisord.conf"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_USE_HTTP_BEHIND_PROXY: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,smartexchange-application-o0bso2-3d625a-204-168-142-183.traefik.me"
      SQLITE_PATH: "/app/backend/data/db.sqlite3"
      # Dev: reset default admin password on each backend start so admin/admin always works
      DEFAULT_ADMIN_SYNC_PASSWORD: "true"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY_TARGET: "http://127.0.0.1:8000"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - media_data:/app/backend/public/media
      - static_data:/app/backend/public/staticfiles
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "18000:8000"
      - "5174:5173"

volumes:
  media_data:
  static_data:
  frontend_node_modules:
